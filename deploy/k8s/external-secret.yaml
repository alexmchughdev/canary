apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: canary-slack
  namespace: canary
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: canary-slack
    creationPolicy: Owner
  data:
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: secret/canary
        property: slack_app_token
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: secret/canary
        property: slack_bot_token
