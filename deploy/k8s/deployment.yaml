apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: canary
  labels:
    app.kubernetes.io/name: canary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: canary
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: ghcr.io/alexmchughdev/canary:latest
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/canary/canary.yaml"]
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - secretRef:
                name: canary-slack
          volumeMounts:
            - name: config
              mountPath: /etc/canary
              readOnly: true
            - name: data
              mountPath: /var/lib/canary
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: canary-config
        - name: data
          persistentVolumeClaim:
            claimName: canary-data
