apiVersion: v1
kind: Service
metadata:
  name: foghorn-metrics
  namespace: foghorn
  labels:
    app.kubernetes.io/name: foghorn
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foghorn
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foghorn
  namespace: foghorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foghorn-data
  namespace: foghorn
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
