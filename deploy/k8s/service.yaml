apiVersion: v1
kind: Service
metadata:
  name: canary-metrics
  namespace: canary
  labels:
    app.kubernetes.io/name: canary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: canary
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canary
  namespace: canary
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: canary-data
  namespace: canary
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
