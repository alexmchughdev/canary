slack:
  app_token_env: SLACK_APP_TOKEN
  bot_token_env: SLACK_BOT_TOKEN

channels:
  monitor:
    - C01234ABCD
    - C01234EFGH
  alert_to: C01234IJKL

detection:
  learning_messages: 20
  drift_sigma: 3
  offline_multiplier: 5
  hard_cap: 30m

learning:
  lookback: 7d

cluster:
  epsilon: 0.4
  min_pts: 3
  match_threshold: 0.5
  stable_ratio: 0.8

alerts:
  cooldown_per_kind: 15m

store:
  path: /var/lib/foghorn/foghorn.db

metrics:
  addr: :9090

senders: {}
